services:
  - type: web
    name: scribe-api
    env: python
    plan: free
    buildCommand: echo "no build"
    startCommand: python api/app.py
    envVars:
      - key: PORT
        value: 10000
      - key: TRACK_DB_FILE
        value: /opt/render/project/src/api/data/track.db
      - key: TRACK_RATE_LIMIT
        value: "300"
      - key: TRACK_PUBLIC_KEY
        sync: false
      - key: SUMMARY_SECRET
        sync: false
staticSites:
  - name: scribe-site
    branch: main
    buildCommand: cp -r landing/* .
    publishPath: "."
    # static site placeholder — Netlify is recommended for static
